<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>AR 3D Product Viewer — Gesture Controlled</title>
<link rel="stylesheet" href="style.css" />

<!-- model-viewer = iOS Quick Look fallback for USDZ -->
<script type="module"
  src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<!-- Import map for Three.js ecosystem -->
<script type="importmap">
{
  "imports": {
    "three":            "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":    "https://unpkg.com/three@0.160.0/examples/jsm/",
    "cannon-es":        "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js",
    "three-to-cannon":  "https://unpkg.com/three-to-cannon@4.3.0/dist/three-to-cannon.modern.js",
    "@mediapipe/tasks-vision":
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
  }
}
</script>
</head>
<body>

<!-- Fallback USDZ Quick Look anchor for iOS Safari -->
<model-viewer id="ios-fallback"
  src="models/product.glb"
  ios-src="models/product.usdz"
  ar ar-modes="webxr scene-viewer quick-look"
  camera-controls touch-action="pan-y"
  style="display:none;width:100vw;height:100vh">
</model-viewer>

<!-- Main AR canvas overlay -->
<div id="overlay">
  <div id="hud">
    <div id="gesture">Gesture: —</div>
    <div id="mode">Mode: Place</div>
    <div id="gravity">Gravity: ON</div>
  </div>
  <button id="enter-ar">Enter AR</button>
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="gesture-canvas"></canvas>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
